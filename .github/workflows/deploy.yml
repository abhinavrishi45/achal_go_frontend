name: 🚀 Deploy Next.js to FTP Server

on:
  push:
    branches:
      - main  # Trigger deploy on main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: 🧰 Checkout repository
        uses: actions/checkout@v4

      # Step 2: Setup Node.js
      - name: ⚡ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0' # Match your local Node.js version

      # Step 3: Install dependencies
      - name: 📦 Install dependencies
        run: npm ci

      # Step 4: Build Next.js project
      - name: 🏗️ Build Next.js
        run: npm run build
        
    # ✅ IMPORTANT (only if using output: "export")
      - name: 📤 Export static files
        run: npm run export

      # Step 5: Upload `out` folder via FTPS (clean remote folder first, preserve .htaccess)
      - name: 📂 Deploy `out` folder to FTP server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftp
          local-dir: ./out/           # Only upload the static export
          server-dir: /               # Remote folder (adjust if needed)
          #delete-remote-dir: true     # Clean remote folder before upload
          exclude: |
            **/.git*
            **/.github/**
            **/README.md
            .htaccess                 # Keep .htaccess on the server